<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jellyshot: jelly randomizer</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #f1e8ee; font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; color: #3a2547; font-size: 12px; font-weight: 700; text-shadow: 0 1px 0 rgba(255,255,255,.8); }
.lab b { display: block; font-size: 13px; }
.lab i { font-style: normal; font-weight: 600; opacity: .75; }
.say { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 12px; display: inline-block; margin-bottom: 4px; padding: 3px 9px; border-radius: 12px; background: #fff8ec; color: #3a2547; font-weight: 700; box-shadow: 0 2px 6px rgba(40,20,60,.2); }
.say:empty { display: none; }
body.nolabels .lab { display: none !important; }
.lab.sel b { color: #d4317a; }
#ui { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(96vw, 720px); }
button, select { font: inherit; font-weight: 800; font-size: 15px; border: 0; border-radius: 18px; padding: 10px 16px; color: #fff; background: radial-gradient(130% 120% at 30% 22%, #ffb0d6, #ff6aa8 46%, #d63f86); box-shadow: inset 2px 3px 4px rgba(255,255,255,.45), inset -2px -3px 5px rgba(120,20,70,.35), 0 3px 8px rgba(40,20,60,.25); cursor: pointer; }
.seg { display: flex; border-radius: 18px; overflow: hidden; box-shadow: 0 3px 8px rgba(40,20,60,.25); }
.seg button { border-radius: 0; box-shadow: none; background: #efe3f4; color: #6b4a7d; }
.seg button.on { background: radial-gradient(130% 120% at 30% 22%, #d8c4fb, #a68cff 46%, #7a5cd0); color: #fff; }
select { background: #fff8ec; color: #3a2547; }
#card { position: fixed; right: 12px; top: max(12px, env(safe-area-inset-top)); width: min(300px, 70vw); padding: 12px 14px; border-radius: 18px; background: rgba(255,248,236,.94); color: #3a2547; box-shadow: 0 4px 14px rgba(40,20,60,.22); font-size: 13px; line-height: 1.35; }
#card h2 { margin: 0 0 2px; font-size: 17px; }
#card .sw { display: inline-block; width: 12px; height: 12px; border-radius: 6px; vertical-align: -1px; margin-right: 4px; }
#card ul { margin: 6px 0 8px; padding-left: 18px; }
#card button { font-size: 13px; padding: 6px 12px; }
#card .hint { opacity: .6; font-size: 12px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="card"></div>
<div id="ui">
  <button id="roll">Reroll all</button>
  <div class="seg" id="mode"><button data-m="mix" class="on">Mix</button><button data-m="named">Named</button><button data-m="crowd">Crowd</button><button data-m="test">Review</button></div>
  <div class="seg" id="view"><button data-y="0" class="on">Front</button><button data-y="0.75">¾</button><button data-y="1.5708">Side</button><button data-y="3.1416">Back</button></div>
  <button id="labs">Labels</button>
  <select id="force"><option value="">Random behaviour</option></select>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer, scene, light: same studio as clay3d ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f1e8ee');
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minZoom = .5; controls.maxZoom = 8; controls.enablePan = true;

function clayNoise() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  const rnd = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  const smooth = (x, y, f) => { const xi = Math.floor(x * f), yi = Math.floor(y * f), xf = x * f - xi, yf = y * f - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = f;
    const a = rnd(xi % w, yi % w), b = rnd((xi + 1) % w, yi % w), c2 = rnd(xi % w, (yi + 1) % w), d = rnd((xi + 1) % w, (yi + 1) % w);
    return a + (b - a) * u + (c2 - a) * v + (a - b - c2 + d) * u * v; };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const nx = x / S, ny = y / S;
    let n = smooth(nx, ny, 4) * .5 + smooth(nx, ny, 9) * .3 + smooth(nx, ny, 23) * .2;
    n += Math.sin((nx * 3 + ny * 2) * 18 + smooth(nx, ny, 5) * 6) * .04;
    const v = Math.max(0, Math.min(255, n * 255)), i = (y * S + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const BUMP = clayNoise();
const mats = new Map();
function clay(hex, bump = .55) {
  const key = 'c' + hex + bump;
  if (!mats.has(key)) { const col = new THREE.Color(hex);
    mats.set(key, new THREE.MeshPhysicalMaterial({ color: col, roughness: .82, sheen: .55, sheenRoughness: .7,
      sheenColor: col.clone().lerp(new THREE.Color('#fff'), .55), bumpMap: BUMP, bumpScale: bump })); }
  return mats.get(key);
}
function glossy(hex, extra = {}) {
  const key = 'g' + hex + JSON.stringify(extra);
  if (!mats.has(key)) mats.set(key, new THREE.MeshPhysicalMaterial({ color: hex, roughness: .25, clearcoat: .7, clearcoatRoughness: .25, ...extra }));
  return mats.get(key);
}
const geos = new Map();
const G = (k, make) => { if (!geos.has(k)) geos.set(k, make()); return geos.get(k); };

scene.add(new THREE.HemisphereLight('#d8ecff', '#8fb86a', 1.35));
const key = new THREE.DirectionalLight('#fff1dc', 2.7);
key.position.set(-14, 26, 14); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 90 });
key.shadow.radius = 9; key.shadow.blurSamples = 20; key.shadow.bias = -.0006;
scene.add(key);
const rimL = new THREE.DirectionalLight('#ffd6ec', .7); rimL.position.set(12, 8, -18); scene.add(rimL);
// lineup shelves (one per row), rebuilt by layout()
const shelves = new THREE.Group(); scene.add(shelves);
const ROW_H = 3.1, COL_W = 2.7;

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
const sph = (r, w = 20, h = 14) => G(`s${r}${w}${h}`, () => new THREE.SphereGeometry(r, w, h));
const cyl = (rt, rb, h, n = 20, open = false) => G(`c${rt},${rb},${h},${n},${open}`, () => new THREE.CylinderGeometry(rt, rb, h, n, 1, open));
const tor = (r, t, a = Math.PI * 2) => G(`t${r},${t},${a}`, () => new THREE.TorusGeometry(r, t, 10, 28, a));
const cone = (r, h, n = 18) => G(`k${r},${h},${n}`, () => new THREE.ConeGeometry(r, h, n));
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

/* ---------- the clay3d body (with arm nubs where the ears were) ---------- */
const PROFILE = [[0, 0], [.78, 0], [.95, .1], [1.0, .3], [.96, .62], [.84, .92], [.62, 1.16], [.34, 1.3], [0, 1.34]];
const profPts = new THREE.SplineCurve(PROFILE.map(([x, y]) => new THREE.Vector2(x, y))).getPoints(40).map(p => new THREE.Vector2(Math.max(0, p.x), p.y));
profPts[profPts.length - 1].x = 0;
// rotated so the UV seam is at the back: u = .5 is the front centre, u grows toward +x
const bodyGeo = new THREE.LatheGeometry(profPts, 48).rotateY(Math.PI); bodyGeo.computeVertexNormals();
const rAt = y => { for (let i = 1; i < profPts.length; i++) if (profPts[i].y >= y) { const a = profPts[i - 1], b = profPts[i]; return a.x + (b.x - a.x) * (y - a.y) / (b.y - a.y || 1); } return 0; };

/* ---------- paint layer: every jelly gets its own canvas on the body and on the eyes ----------
   Body canvas: u = .5 + angle/2pi (angle 0 = front, + toward +x), v from the profile index (0 = feet).
   Eye canvas: equirect on the eyeball, front centre at u = .25, v = .5. Pupils are paint, not geometry;
   looking around slides the texture. */
const vAt = y => { for (let i = 1; i < profPts.length; i++) if (profPts[i].y >= y) return (i - 1 + (y - profPts[i - 1].y) / (profPts[i].y - profPts[i - 1].y || 1)) / (profPts.length - 1); return 1; };
const BW = 1024, BH = 512;
const bpx = (angle, y) => [(.5 + angle / (Math.PI * 2)) * BW, (1 - vAt(y)) * BH];
const shade = (hex, l) => new THREE.Color(hex).offsetHSL(0, 0, l).getStyle();
const PAINT = {
  blush(c, col) { for (const s of [-1, 1]) { const [x, y] = bpx(s * .62, .6);
    const g = c.createRadialGradient(x, y, 0, x, y, 46); g.addColorStop(0, 'rgba(255,70,120,.55)'); g.addColorStop(1, 'rgba(255,70,120,0)');
    c.fillStyle = g; c.fillRect(x - 60, y - 60, 120, 120); } },
  'belly patch'(c, col) { const [x, y] = bpx(0, .2); c.fillStyle = shade(col, .12); c.beginPath(); c.ellipse(x, y, 120, 70, 0, 0, Math.PI * 2); c.fill(); },
  frosting(c, col) { const fc = pick(['#fff6ee', '#ff86c4', '#6b3a2a', '#a68cff', '#ffd84a']); const [, top] = bpx(0, 1.0);
    c.fillStyle = fc; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, top);
    for (let x = 0; x <= BW; x += 64) { const d = top + 10 + (Math.sin(x * .7) * .5 + .5) * 40; c.lineTo(x + 16, top); c.quadraticCurveTo(x + 32, d + 30, x + 48, top); }
    c.lineTo(BW, 0); c.fill(); },
  stripes(c, col) { c.fillStyle = shade(col, pick([-.1, .12])); for (const y of [.3, .55]) { const [, a] = bpx(0, y), [, b] = bpx(0, y + .1); c.fillRect(0, b, BW, a - b); } },
  spots(c, col) { c.fillStyle = shade(col, -.1); for (let i = 0; i < 9; i++) { const [x, y] = bpx(Math.PI * (.6 + Math.random() * .8) * pick([-1, 1]), rand(.2, 1.05)); c.beginPath(); c.arc(x, y, rand(14, 26), 0, Math.PI * 2); c.fill(); } },
  'heart tattoo'(c, col) { const [x, y] = bpx(Math.PI * pick([-.5, .5, 1]), .5); c.fillStyle = pick(['#ff3a6e', '#4a2a6e']); c.save(); c.translate(x, y); c.scale(1.4, 1.4);
    c.beginPath(); c.moveTo(0, 12); c.bezierCurveTo(-26, -6, -12, -24, 0, -10); c.bezierCurveTo(12, -24, 26, -6, 0, 12); c.fill(); c.restore(); },
};
function bodyMaterial(col, paints) {
  const cv = document.createElement('canvas'); cv.width = BW; cv.height = BH; const c = cv.getContext('2d');
  c.fillStyle = col; c.fillRect(0, 0, BW, BH);
  for (const p of paints) PAINT[p](c, col);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const sc = new THREE.Color(col).lerp(new THREE.Color('#fff'), .55);
  return new THREE.MeshPhysicalMaterial({ map: tex, roughness: .82, sheen: .55, sheenRoughness: .7, sheenColor: sc, bumpMap: BUMP, bumpScale: .55 });
}
const EYE_STYLES = ['normal', 'normal', 'small pupils', 'big pupils', 'sleepy lids', 'mismatched'];
function eyeMaterial(col, pupil, lid = 0) {
  const W = 256, H = 128, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  c.fillStyle = '#fbf8f4'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#241a2e'; c.beginPath(); c.arc(W * .25, H * .5, pupil, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(W * .25 - pupil * .35, H * .5 - pupil * .4, Math.max(2.5, pupil * .22), 0, Math.PI * 2); c.fill();
  if (lid) { c.fillStyle = col; c.fillRect(0, 0, W, H * lid); c.fillStyle = shade(col, -.15); c.fillRect(0, H * lid - 3, W, 4); }
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = THREE.RepeatWrapping; tex.anisotropy = 4;
  return new THREE.MeshPhysicalMaterial({ map: tex, roughness: .3, clearcoat: .6, clearcoatRoughness: .2 });
}

const JELLY_COLS = ['#ff86c4', '#4fdcb9', '#ff9a3c', '#a68cff', '#4a8dff', '#ffd84a', '#ff5a6e', '#3cc8e0', '#8ad84a', '#ff7aa8'];
const COL_NAMES = { '#ff86c4': 'bubblegum', '#4fdcb9': 'mint', '#ff9a3c': 'orange', '#a68cff': 'grape', '#4a8dff': 'blueberry', '#ffd84a': 'lemon', '#ff5a6e': 'cherry', '#3cc8e0': 'aqua', '#8ad84a': 'lime', '#ff7aa8': 'strawberry' };
const HAT_COLS = ['#2a2035', '#ff5a4e', '#4a8dff', '#ffd84a', '#8a5cff', '#3cc8a0', '#ff86c4', '#fff4e6', '#ff9a3c'];
const HAIR_COLS = ['#3b2a2a', '#6b4226', '#f2c14e', '#efe6dc', '#ff7a3c', '#7a4cff', '#ff5aa0', '#2b2b2b', '#4fdcb9'];
const GOLD = () => glossy('#ffcf3a', { roughness: .2, metalness: .6 });

/* ---------- accessory helpers ---------- */
const onFace = (x, y, lift = 0) => new THREE.Vector3(x, y, Math.sqrt(Math.max(0, rAt(y) ** 2 - x * x)) + lift);
// a shell that follows the body's dome from height y0 up, pushed out by `off`: hats and caps never clip the head
function domeShell(y0, off, lift = 1) {
  return G(`dome${y0},${off},${lift}`, () => {
    const src = [new THREE.Vector2(rAt(y0), y0), ...profPts.filter(p => p.y > y0 + 1e-3)];
    const out = src.map((p, i) => {
      const a = src[Math.max(0, i - 1)], b = src[Math.min(src.length - 1, i + 1)];
      let tx = b.x - a.x, ty = b.y - a.y; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      const [nx, ny] = i === src.length - 1 ? [0, 1] : [ty, -tx];
      return new THREE.Vector2(Math.max(0, p.x + nx * off), y0 + (p.y + ny * off - y0) * lift);
    });
    out[out.length - 1].x = 0;
    return new THREE.LatheGeometry(out, 56);
  });
}
const shellTop = (y0, off, lift = 1) => y0 + (1.34 + off - y0) * lift;
// a tube along a curve whose radius follows rFn(t), t = 0..1
function taperTube(key, pts, rFn, seg = 48, rad = 14) {
  return G(key, () => {
    const curve = new THREE.CatmullRomCurve3(pts), g = new THREE.TubeGeometry(curve, seg, 1, rad, false);
    const pos = g.attributes.position, c = new THREE.Vector3(), v = new THREE.Vector3();
    for (let i = 0; i <= seg; i++) { curve.getPointAt(i / seg, c); const r = rFn(i / seg);
      for (let j = 0; j <= rad; j++) { const k = i * (rad + 1) + j; v.fromBufferAttribute(pos, k).sub(c).multiplyScalar(r).add(c); pos.setXYZ(k, v.x, v.y, v.z); } }
    g.computeVertexNormals(); g.userData.ends = [curve.getPointAt(0), curve.getPointAt(1)]; return g;
  });
}
// squash a tube built on the face toward the face surface (k = how much depth to keep)
function relief(geo, k) {
  if (geo.userData.relief) return geo; const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), zs = onFace(x, y).z; p.setZ(i, zs + (z - zs) * k); }
  geo.computeVertexNormals(); geo.userData.relief = true; return geo;
}
function roundRect(p, w, h, r) {
  p.moveTo(-w / 2 + r, -h / 2); p.lineTo(w / 2 - r, -h / 2); p.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  p.lineTo(w / 2, h / 2 - r); p.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); p.lineTo(-w / 2 + r, h / 2);
  p.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); p.lineTo(-w / 2, -h / 2 + r); p.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
}
// a lens frame: a flat ring with soft bevelled edges
function frameGeo(kind) {
  return G('frame' + kind, () => {
    const sh = new THREE.Shape(), hole = new THREE.Path();
    if (kind === 'round') { sh.absarc(0, 0, .245, 0, Math.PI * 2); hole.absarc(0, 0, .212, 0, Math.PI * 2); }
    else { roundRect(sh, .5, .4, .13); roundRect(hole, .44, .34, .1); }
    sh.holes.push(hole);
    const g = new THREE.ExtrudeGeometry(sh, { depth: .02, bevelEnabled: true, bevelThickness: .01, bevelSize: .008, bevelSegments: 3, curveSegments: 40 });
    g.translate(0, 0, -.01); return g;
  });
}
function lensGeo(kind) {
  return G('lens' + kind, () => { const sh = new THREE.Shape(); if (kind === 'round') sh.absarc(0, 0, .215, 0, Math.PI * 2); else roundRect(sh, .45, .35, .1); return new THREE.ShapeGeometry(sh, 32); });
}
const LENS = new THREE.MeshPhysicalMaterial({ color: '#ffffff', transparent: true, opacity: .14, roughness: .05, clearcoat: 1, depthWrite: false });
const GOLD2 = () => glossy('#ffcf3a', { roughness: .2, metalness: .6, side: THREE.DoubleSide });

/* ---------- 2D art cards (cut-out paintings used on the 3D jellies) ---------- */
const texLoader = new THREE.TextureLoader();
const ART = { bow: .479, moustache: .312, lollipop: 1.477 };   // height / width
const TEX2D = {};
for (const n of Object.keys(ART)) { const t = texLoader.load(`assets/2d/${n}.png`); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; TEX2D[n] = t; }
function cardMat(n) {
  const k = 'card' + n;
  if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ map: TEX2D[n], transparent: true, alphaTest: .3, roughness: .8, side: THREE.DoubleSide,
    emissive: '#ffffff', emissiveMap: TEX2D[n], emissiveIntensity: .3 }));
  return mats.get(k);
}
const cardGeo = (n, w, sx = 1, sy = 1) => G(`card${n}${w}${sx}${sy}`, () => new THREE.PlaneGeometry(w, w * ART[n], sx, sy));
// a card bent onto the face like a sticker
function faceDecal(n, w, y, lift = .012) {
  return G(`decal${n}${w}${y}`, () => {
    const g = new THREE.PlaneGeometry(w, w * ART[n], 40, 6), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const v = onFace(p.getX(i), p.getY(i) + y, lift); p.setXYZ(i, v.x, v.y, v.z); }
    g.computeVertexNormals(); return g;
  });
}

/* ---------- accessory kit ---------- */
const HEAD = {
  'top hat'(g) { const c = pick(['#2a2035', '#2a2035', '#7a3cff', '#3a7a4a']), hm = clay(c);
    mesh(cyl(.62, .62, .08, 28), hm, g, 0, 1.3); mesh(cyl(.4, .42, .72, 24), hm, g, 0, 1.68);
    mesh(cyl(.43, .43, .14, 24), clay(pick(['#ff5c9e', '#ffd84a', '#4fdcb9'])), g, 0, 1.42); },
  bowler(g) { const m = clay(pick(['#2a2035', '#6b4226', '#3a3a50'])), y0 = 1.08, R = rAt(y0) + .06;
    mesh(domeShell(y0, .06, 1.4), m, g);
    mesh(cyl(R + .2, R + .2, .03, 48), m, g, 0, y0, 0);
    mesh(tor(R + .2, .028), m, g, 0, y0 + .02, 0).rotation.x = Math.PI / 2;
    mesh(G('bowlband', () => new THREE.CylinderGeometry(R - .005, R + .005, .09, 48, 1, true)), glossy('#1a1220', { side: THREE.DoubleSide }), g, 0, y0 + .06, 0); },
  crown(g) { const m = GOLD2(), cg = new THREE.Group(); cg.position.y = 1.25; cg.rotation.z = pick([-1, 1]) * .12; g.add(cg);
    const R = rAt(1.25) + .025;
    const vel = mesh(sph(R * .92, 32, 16), clay('#c8264a'), cg, 0, 0, 0); vel.scale.y = .55;

/* ---------- build one jelly ---------- */
const labelsEl = document.getElementById('labels');
const jellies = [];
function makeJelly(home, tier, spec = null) {
  const col = spec?.col ?? pick(JELLY_COLS), hair = spec?.hair ?? pick(HAIR_COLS);
  const size = spec ? .78 : tier === 'named' ? rand(.62, .82) : rand(.5, .68);
  const w = spec ? 1 : rand(.94, 1.1), h = spec ? 1 : rand(.92, 1.14);
  const root = new THREE.Group(); root.position.copy(home); root.rotation.y = 0; scene.add(root);
  const rig = new THREE.Group(); root.add(rig);
  const items = [];
  const paints = spec ? [] : tier === 'named' ? (chance(.75) ? shuffle(Object.keys(PAINT)).slice(0, chance(.3) ? 2 : 1) : []) : (chance(.3) ? [pick(Object.keys(PAINT))] : []);

  const feet = [-.42, .42].map(sx => { const f = mesh(sph(.3, 16, 10), footMat, rig, sx, .1, .18); f.scale.set(1, .55, 1.15); return f; });
  const eyeStyle = spec ? 'normal' : tier === 'named' ? pick(EYE_STYLES) : chance(.8) ? 'normal' : pick(EYE_STYLES);
  const pr = { normal: 19, 'small pupils': 11, 'big pupils': 27, 'sleepy lids': 19, mismatched: 19 }[eyeStyle];
  const lid = eyeStyle === 'sleepy lids' ? .44 : 0;
  const eyeMats = eyeStyle === 'mismatched' ? [eyeMaterial(col, 26), eyeMaterial(col, 10)] : [eyeMaterial(col, pr, lid)];
  const eyes = [-.24, .24].map((sx, i) => { const e = mesh(sph(.2, 32, 20), eyeMats[i % eyeMats.length], rig, sx, .78, .8); e.scale.set(1, 1.15, .6); return e; });
  if (eyeStyle !== 'normal') items.push(eyeStyle);
  items.push(...paints);
  // arm nubs: the clay3d ear, moved to the sides on a shoulder pivot
  const arms = [-1, 1].map(side => {
    const pivot = new THREE.Group(); pivot.position.set(side * .9, .68, .1); rig.add(pivot);
    const nub = mesh(sph(.26, 18, 12), bodyMat, pivot, side * .1, -.16, 0); nub.scale.set(.85, 1.15, .9);
    const hold = new THREE.Group(); hold.position.set(side * .12, -.36, .16); hold.rotation.order = 'ZYX'; pivot.add(hold);
    return { side, pivot, nub, hold };
  });
  // accessories
  const acc = new THREE.Group(); rig.add(acc);
    let slots;
  if (tier === 'named') {
    const n = chance(.5) ? 2 : 3;
    slots = chance(.85) ? ['head', ...shuffle(['eyewear', 'facial', 'brows', 'earrings']).slice(0, n - 1)] : shuffle(['eyewear', 'facial', 'brows', 'earrings']).slice(0, n);
  } else slots = chance(.55) ? [chance(.5) ? 'head' : pick(['eyewear', 'facial', 'brows', 'earrings'])] : [];
  if (spec) for (const [s, name, o] of spec.items ?? []) { SLOTS[s][name](acc, hair, o ?? {}); items.push(name + (o?.style ? ` (${o.style})` : '')); }
  else for (const s of slots) { const kit = SLOTS[s], name = pick(Object.keys(kit)); kit[name](acc, hair); items.push(name); }
  // behaviour and prop
  const beh = spec?.beh ?? (force.value || (tier === 'named' ? pick(NAMED_BEH) : pick(CROWD_BEH)));
  const propName = spec ? spec.prop ?? null : pick(BEHAVIOURS[beh].props);
  if (propName) PROPS[propName](arms[1].hold);
  rig.scale.set(size * w, size * h, size * w);
  // contact shadow + label
  const lab = document.createElement('div'); lab.className = 'lab';
  const sayEl = document.createElement('span'); sayEl.className = 'say'; labelsEl.appendChild(sayEl);
  lab.innerHTML = spec ? `<b>${spec.label}</b>` : `${tier === 'named' ? `<b>${pick(FIRST)} ${pick(LAST)}</b>` : ''}<i>${BEHAVIOURS[beh].label}</i>`;
  labelsEl.appendChild(lab);
  const j = { root, rig, body, feet, eyes, eyeMats, arms, acc, home: home.clone(), size, w, h, col, hair, tier, items, beh, propName,
    ph: rand(0, 20), lab, say: sayEl, name: lab.querySelector('b')?.textContent ?? 'crowd jelly', nextFx: 0, sayT: 0, face0: 0 };
  root.traverse(o => { o.userData.j = j; });
  return j;
}
function disposeJelly(j) { scene.remove(j.root); j.lab.remove(); j.say.remove(); }

/* ---------- lineup ---------- */
let mode = 'mix', selected = null, focus = null, viewYaw = 0, grid = { cols: 4, rows: 3 };
function setFocus(j) {
  focus = j;
  if (j) { aim(j.home.x, j.home.y + .95, 1.05, 1.1); } else resize();
  if (selected) select(selected);
}
function layout() {
  const portrait = innerWidth < innerHeight, cols = mode === 'test' ? 4 : portrait ? 3 : 4, rows = mode === 'test' ? Math.ceil(TEST.length / 4) : portrait ? 4 : 3;
  const pts = [];
  shelves.clear();
  for (let r = 0; r < rows; r++) {
    const y = (rows - 1 - r) * ROW_H;
    const sh = mesh(G(`shelf${cols}`, () => new THREE.BoxGeometry(cols * COL_W + .6, .16, 2.4)), clay('#f6e9d4', 1), shelves, 0, y - .08, 0);
    for (let c = 0; c < cols; c++) pts.push(new THREE.Vector3((c - (cols - 1) / 2) * COL_W, y, 0));
  }
  grid = { cols, rows };
  return pts;
}
// side-by-side review shelves: 2D art cards against their 3D versions, then the reworked presets
const TEST = [
  { label: 'bow (2D)', items: [['head', 'bow (2D)']], beh: 'idle', col: '#4fdcb9' },
  { label: 'moustache (2D)', items: [['facial', 'moustache (2D)']], beh: 'idle', col: '#ffd84a' },
  { label: 'lollipop (2D)', beh: 'eating', prop: 'lollipop (2D)', col: '#a68cff' },
  { label: 'bow (3D)', items: [['head', 'bow']], beh: 'idle', col: '#4fdcb9' },
  { label: 'moustache (3D)', items: [['facial', 'moustache']], beh: 'idle', col: '#ffd84a', hair: '#7a3a20' },
  { label: 'lollipop (3D)', beh: 'eating', prop: 'lollipop', col: '#a68cff' },
  { label: 'cigar (3D)', beh: 'smoking', prop: 'cigar', col: '#ff86c4' },
  { label: 'crown', items: [['head', 'crown']], beh: 'idle', col: '#a68cff' },
  { label: 'cap', items: [['head', 'cap']], beh: 'idle', col: '#4a8dff' },
  { label: 'chef hat', items: [['head', 'chef hat']], beh: 'idle', col: '#ff9a3c' },
  { label: 'braided bun', items: [['head', 'braided bun']], beh: 'idle', col: '#ff86c4', hair: '#6b4226' },
  { label: 'bowler', items: [['head', 'bowler']], beh: 'idle', col: '#3cc8e0' },
  { label: 'beanie', items: [['head', 'beanie']], beh: 'idle', col: '#8ad84a' },
  { label: 'propeller', items: [['head', 'propeller']], beh: 'idle', col: '#ff5a6e' },
  { label: 'handlebar', items: [['facial', 'handlebar']], beh: 'idle', col: '#4fdcb9', hair: '#3b2a2a' },
  { label: 'glasses (round)', items: [['eyewear', 'glasses', { style: 'round' }]], beh: 'idle', col: '#ffd84a' },
  { label: 'glasses (rect)', items: [['eyewear', 'glasses', { style: 'rect' }]], beh: 'idle', col: '#4a8dff' },
  { label: 'monocle', items: [['eyewear', 'monocle']], beh: 'idle', col: '#8ad84a' },
  { label: 'sunglasses', items: [['eyewear', 'sunglasses']], beh: 'idle', col: '#ff9a3c' },
];
function tierFor(i) { return mode === 'mix' ? (i % 3 === 0 ? 'named' : 'crowd') : mode; }
function rollAll() {
  jellies.splice(0).forEach(disposeJelly); if (focus) { focus = null; resize(); }
  layout().forEach((p, i) => { if (mode !== 'test') jellies.push(makeJelly(p, tierFor(i))); else if (TEST[i]) jellies.push(makeJelly(p, 'named', TEST[i])); });
  select(jellies.find(j => j.tier === 'named') ?? jellies[0]);
}
function rerollOne(j) {
  const i = jellies.indexOf(j); disposeJelly(j);
  const nj = makeJelly(j.home, j.tier, mode === 'test' ? TEST[i] : null); jellies[i] = nj; if (focus === j) focus = nj; select(nj); if (focus) setFocus(nj);
}
const card = document.getElementById('card');
function select(j) {
  selected = j; jellies.forEach(o => o.lab.classList.toggle('sel', o === j));
  if (!j) { card.innerHTML = ''; return; }
  const sz = j.size > .74 ? 'big' : j.size > .6 ? 'medium' : 'small';
  const shape = j.h > 1.07 ? ', tall' : j.h < .97 ? ', squat' : '';
  card.innerHTML = `<h2>${j.name}</h2>
    <div><span class="sw" style="background:${j.col}"></span>${COL_NAMES[j.col]}, ${sz}${shape} · ${j.tier}</div>
    <ul>${j.items.map(i => `<li>${i}</li>`).join('') || '<li>no accessories</li>'}${j.propName ? `<li>holding a ${j.propName}</li>` : ''}<li><b>${BEHAVIOURS[j.beh].label}</b></li></ul>
    <button id="one">Reroll this one</button> <button id="close">${focus ? 'Back to lineup' : 'Close-up'}</button>`;
  card.querySelector('#one').onclick = () => rerollOne(j);
  card.querySelector('#close').onclick = () => setFocus(focus ? null : j);
}
document.getElementById('roll').onclick = rollAll;
for (const b of document.querySelectorAll('#mode button')) b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); rollAll(); resize();
};
force.onchange = rollAll;

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(jellies.map(j => j.root), true)[0];
  if (hit) { const j = hit.object.userData.j; if (j === selected) j.poke = 1; select(j); }
});

/* ---------- puffs (smoke, sweat) ---------- */
const puffs = [];
const puffGeo = new THREE.SphereGeometry(1, 12, 8);
function puff(pos, color, vel, life, size) {
  let p = puffs.find(p => p.t >= p.life);
  if (!p) { p = { m: new THREE.Mesh(puffGeo, new THREE.MeshStandardMaterial({ transparent: true, depthWrite: false, roughness: 1 })) }; scene.add(p.m); puffs.push(p); }
  p.m.material.color.set(color); p.m.position.copy(pos); Object.assign(p, { v: vel.clone(), t: 0, life, size }); p.m.visible = true;
}
function tickPuffs(dt) {
  for (const p of puffs) { if (p.t >= p.life) { p.m.visible = false; continue; }
    p.t += dt; const k = p.t / p.life; p.m.position.addScaledVector(p.v, dt);
    p.m.scale.setScalar(p.size * (.5 + k)); p.m.material.opacity = .75 * (1 - k); }
}

/* ---------- animation ---------- */
const v3 = new THREE.Vector3();
function setArm(a, fwd, out, stretch = 1) {
  a.pivot.rotation.set(-fwd, 0, a.side * out); a.pivot.scale.set(1, stretch, 1);
  a.hold.rotation.set(fwd, 0, -a.side * out); a.hold.scale.set(1, 1 / stretch, 1);
}
function animate(j, t, dt) {
  const T = t + j.ph, [L, R] = j.arms;
  let bob = 0, q = Math.sin(T * 2.2) * .025, lean = 0, turn = 0, crouch = 0;
  let lf = 0, lo = .12, rf = 0, ro = .12, rs = 1;
  let look = [Math.sin(T * .7) * .03, 0], closed = false, say = '';
  j.root.position.copy(j.home); j.root.rotation.y = j.face0 + viewYaw;
  j.feet.forEach((f, i) => f.position.set(i ? .42 : -.42, .1, .18));
  switch (j.beh) {
    case 'idle': lo = ro = .15 + Math.sin(T * 1.3) * .05; break;
    case 'waving': { ro = 2.5 + Math.sin(T * 12) * .35; rf = .3; lean = -.05; break; }
    case 'smoking': {
      const c = T % 4.5, up = ease(c / .8) * (1 - ease((c - 2.4) / .8));
      rf = 1.5 * up; ro = .15 - .55 * up; rs = 1 + .35 * up; q += up * .04 * Math.sin(Math.min(1, (c - .8) / 1.6) * Math.PI);
      if (t > j.nextFx) { j.nextFx = t + .35; const tip = R.hold.userData.tip; if (tip) puff(tip.getWorldPosition(v3), '#ffffff', new THREE.Vector3(rand(-.1, .1), .5, 0), 1.6, .05); }
      if (c > 2.6 && c < 3.4 && t > (j.exhale ?? 0)) { j.exhale = t + .12; j.rig.localToWorld(v3.set(0, .5, 1.05)); puff(v3, '#f4eef6', new THREE.Vector3(rand(-.2, .2), .4, .6).applyAxisAngle(new THREE.Vector3(0, 1, 0), j.root.rotation.y), 1.8, .1); }
      look = [.02, .02]; break; }
    case 'eating': {
      const c = T % 1.8, up = ease(c / .4) * (1 - ease((c - .9) / .4));
      rf = 1.5 * up; ro = .15 - .55 * up; rs = 1 + .35 * up;
      if (c > .45 && c < .9) q = -Math.abs(Math.sin((c - .45) * 21)) * .08;
      look = [0, -.02]; break; }
    case 'dancing': {
      bob = Math.abs(Math.sin(T * 6)) * .35; q = -Math.max(0, .12 - bob) * .8; turn = Math.sin(T * 3) * .45;
      lo = 1.8 + Math.sin(T * 6) * .8; ro = 1.8 - Math.sin(T * 6) * .8; lean = Math.sin(T * 3) * .1; break; }
    case 'bathroom': {
      const a = T * 3.4, rx = .8, rz = .55;
      j.root.position.x = j.home.x + Math.cos(a) * rx; j.root.position.z = j.home.z + Math.sin(a) * rz;
      j.root.rotation.y = Math.atan2(-Math.sin(a) * rx, Math.cos(a) * rz) + viewYaw;
      bob = Math.abs(Math.sin(T * 18)) * .1; lean = .1;
      j.feet.forEach((f, i) => { const s = Math.sin(T * 18 + i * Math.PI); f.position.z = .18 + s * .2; f.position.y = .1 + Math.max(0, s) * .1; });
      lf = Math.sin(T * 18) * .9; rf = -Math.sin(T * 18) * .9; lo = ro = .3;
      j.rig.scale.x = j.size * j.w * (.92 + Math.sin(T * 40) * .015);
      if (t > j.nextFx) { j.nextFx = t + .22; j.rig.localToWorld(v3.set(rand(-.5, .5), 1.2, .3)); puff(v3, '#8fd8ff', new THREE.Vector3(rand(-.8, .8), 1.2, rand(-.3, .3)), .6, .05); }
      say = 'gotta go gotta go'; look = [0, .03]; break; }
    case 'chatting': {
      bob = Math.max(0, Math.sin(T * 5)) * .04; lean = Math.sin(T * 1.3) * .08;
      rf = .7 + Math.sin(T * 5) * .5; ro = .45 + Math.sin(T * 3.1) * .2; lf = .3 + Math.sin(T * 4.3) * .3; lo = .3;
      if (t > j.sayT) { j.sayT = t + rand(2, 3.5); j.line = pick(CHAT); } say = j.line;
      look = [.04, 0]; break; }
    case 'sneaking': {
      crouch = .14; j.root.position.x = j.home.x + Math.sin(T * .9) * .7;
      bob = Math.abs(Math.sin(T * 7)) * .05; lf = rf = .6; lo = ro = 1.0;
      j.feet.forEach((f, i) => { f.position.y = .1 + Math.max(0, Math.sin(T * 7 + i * Math.PI)) * .08; });
      look = [Math.sign(Math.sin(T * 1.7)) * .06, .01]; break; }
    case 'napping': {
      closed = true; q = Math.sin(T * 1.1) * .06; lean = .12; lo = ro = .05; say = 'z z z'; break; }
    case 'phone': {
      rf = 1.25; ro = -.35; rs = 1.2 + Math.sin(T * 9) * .02;
      look = [0, -.05];
      if ((T % 7) > 5.8) { bob = Math.abs(Math.sin(T * 14)) * .1; say = 'LOL'; } break; }
  }
  if (j.poke) { j.poke = Math.max(0, j.poke - dt * 1.6); q += Math.sin(j.poke * 18) * j.poke * .25; }
  j.rig.position.y = bob;
  j.rig.rotation.set(0, turn, lean);
  const sy = j.size * j.h * (1 - q - crouch), sxz = j.size * j.w * (1 + q * .7 + crouch * .4);
  if (j.beh !== 'bathroom') j.rig.scale.set(sxz, sy, sxz); else j.rig.scale.y = sy;
  setArm(L, lf, lo); setArm(R, rf, ro, rs);
  const blink = closed || (T % 3.7) < .12;
  j.eyes.forEach(e => e.scale.y = blink ? .12 : 1.15);
  // painted pupils: slide the eye texture (look is in eye-radius-ish units)
  for (const m of j.eyeMats) { m.map.offset.x = -(look[0] / .2) / (Math.PI * 2); m.map.offset.y = -(look[1] / .2) / Math.PI; }
  if (j.acc.userData.spin) j.acc.userData.spin.rotation.y += dt * 14;
  j.say.textContent = say;
}

/* ---------- labels, resize, loop ---------- */
const toScreen = (el, p) => { p.project(camera); el.style.left = `${(p.x + 1) / 2 * innerWidth}px`; el.style.top = `${(1 - p.y) / 2 * innerHeight}px`; };
function placeLabels() {
  for (const j of jellies) {
    toScreen(j.lab, v3.set(j.home.x, j.home.y - .2, 1.25));   // under the shelf lip, never over a jelly
    j.rig.localToWorld(v3.set(0, 2.2, 0)); toScreen(j.say, v3);
  }
}
// fit a world box (centre x,y; half height halfH, half width halfW) into the screen area the UI leaves free
function aim(x, y, halfH, halfW = 0) {
  const W = innerWidth, H = innerHeight, portrait = W < H;
  const ui = document.getElementById('ui').getBoundingClientRect(), cd = document.getElementById('card').getBoundingClientRect();
  const r = portrait ? { x0: 8, x1: W - 8, y0: cd.bottom + 8, y1: ui.top - 8 } : { x0: 8, x1: cd.left - 8, y0: 8, y1: ui.top - 8 };
  const k = Math.max(2 * halfH / (r.y1 - r.y0), 2 * halfW / (r.x1 - r.x0));   // world units per pixel
  const cx = x - ((r.x0 + r.x1) / 2 - W / 2) * k, cy = y + ((r.y0 + r.y1) / 2 - H / 2) * k;
  Object.assign(camera, { left: -W * k / 2, right: W * k / 2, top: H * k / 2, bottom: -H * k / 2, zoom: 1 });
  camera.position.set(cx, cy + 40 * Math.tan(.12), 40); controls.target.set(cx, cy, 0);
  camera.updateProjectionMatrix(); controls.update();
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  if (focus) return aim(focus.home.x, focus.home.y + .95, 1.05, 1.1);
  aim(0, (grid.rows - 1) * ROW_H / 2 + .7, (grid.rows * ROW_H + .2) / 2, (grid.cols * COL_W + .7) / 2);
  key.target.position.set(0, (grid.rows - 1) * ROW_H / 2, 0); key.target.updateMatrixWorld();
}
let wasPortrait = innerWidth < innerHeight;
addEventListener('resize', () => { resize(); const p = innerWidth < innerHeight; if (p !== wasPortrait) { wasPortrait = p; rollAll(); resize(); } });
for (const b of document.querySelectorAll('#view button')) b.onclick = () => {
  viewYaw = +b.dataset.y; document.querySelectorAll('#view button').forEach(x => x.classList.toggle('on', x === b));
};
document.getElementById('labs').onclick = () => document.body.classList.toggle('nolabels');
{ const qm = new URLSearchParams(location.search).get('mode');
  if (qm) { mode = qm; document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x.dataset.m === qm)); } }
rollAll(); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  for (const j of jellies) animate(j, t, dt);
  tickPuffs(dt); controls.update(); renderer.render(scene, camera); placeLabels();
});
window.__jellies = jellies; window.__cam = { camera, controls }; window.__focus = i => setFocus(i == null ? null : jellies[i]);
</script>
