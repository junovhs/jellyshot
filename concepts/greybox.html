const IW = 941, IH = 1672, HORIZON = 355, ASPECT = IW / IH, JELLY = 1.1, FAR_CAP = 1600;

/* ---------- reference camera: horizon pixel fixes the pitch, boardwalk width fixes the height ---------- */

const cam = new THREE.PerspectiveCamera(60, ASPECT, .2, 6000);

const M = c => new THREE.MeshLambertMaterial({ color: c });

  palm: M('#8fa58a'), trunk: M('#a8957f'), tower: M('#d0a6a0'), towerY: M('#d6c690'), wood: M('#9c8c7e'), white: M('#ecebe8'),
  pink: M('#e3a9c2'), pool: M('#9fd2dc'), green: M('#a9c2a0'), ledge: M('#bdb5aa'), dark: M('#7d7a84') };

  add(new THREE.PlaneGeometry(8000, 8000).rotateX(-Math.PI / 2), MAT.sea, 0, -.15, -1500).castShadow = false;
  flatPoly([...shore, ...far, new THREE.Vector3(3000, 0, far.at(-1).z), new THREE.Vector3(3000, 0, 40)], MAT.sand, 0);

    for (let t = 0; t < len; t += 12) { const p = a.clone().lerp(b, t / len); add(new THREE.CylinderGeometry(.12, .15, 4.5, 6), MAT.dark, p.x + .4, 2.55, p.z); } }

    const c = add(new THREE.SphereGeometry(2.6 * s, 10, 6), MAT.palm, p.x, 7.3 * s, p.z); c.scale.y = .45; };

    boxAt(3, 2.2, 3, mat, new THREE.Vector3(p.x, 2.6, p.z)); boxAt(3.6, .25, 3.6, mat, new THREE.Vector3(p.x, 4.8, p.z)); };

  { const len = n1.distanceTo(n2), mid = n1.clone().lerp(n2, .5), n = add(new THREE.BoxGeometry(len, .9, .05), MAT.white, mid.x, 2.1, mid.z); n.lookAt(mid.x + (n2.z - n1.z), 2.1, mid.z - (n2.x - n1.x));

  for (const q of PX.umbrellas) { const p = cast(q); add(new THREE.CylinderGeometry(.06, .06, 2.4, 5), MAT.white, p.x, 1.2, p.z);

  if (pts.size === 2 && mode === 'perch') { const [a, b] = [...pts.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (!pinch) pinch = d; else if (d / pinch > 1.35) { setStop(stop + 1); pinch = d; } else if (d / pinch < .74) { setStop(stop - 1); pinch = d; } return; }
  if (!drag || mode !== 'perch' || stop === 0) return; const k = cam.fov / frame.clientHeight * Math.PI / 180;
  yaw += (e.clientX - drag.x) * k; pitchOff += (e.clientY - drag.y) * k; drag = { x: e.clientX, y: e.clientY }; });
const up = e => { pts.delete(e.pointerId); drag = null; if (pts.size < 2) pinch = null; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { if (mode !== 'perch') return; e.preventDefault(); setStop(stop + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });

/* ---------- sizing, controls, metrics ---------- */
function resize() {
  const w = Math.min(innerWidth, innerHeight * ASPECT), h = w / ASPECT; frame.style.width = w + 'px'; frame.style.height = h + 'px';
  renderer.setSize(w, h, false);
}
addEventListener('resize', resize);
const $ = id => document.getElementById(id);
function sync() { $('opv').textContent = $('op').value; $('fovv').textContent = $('fov').value + '°'; $('bwv').textContent = $('bw').value;
  $('ref').style.opacity = $('op').value; }
function relayout() { sync(); solveHeight(+$('fov').value, +$('bw').value); build(); setStop(stop); metrics(); }
$('op').oninput = sync; $('fov').oninput = relayout; $('bw').oninput = relayout;
$('panel').querySelector('h1').onclick = () => $('panel').classList.toggle('min');

function jellyPx(dist, fov) {   // on-screen jelly height on a 390-pt-wide phone (the concept frame scaled to that width)
  const screenH = 390 / ASPECT; return JELLY / (2 * dist * Math.tan(fov * Math.PI / 360)) * screenH;
}
function metrics() {
  const eye = rc.position, d = p => Math.hypot(p.x, p.z), towerD = d(cast(PX.towerRed));
  const rows = [['near beach', d(cast([300, 1450]))], ['red tower', towerD], ['pier', d(L.pier)], ['yacht', d(L.yacht.p)], ['resort', d(L.resort)]];
  let s = `camera height  ${CAM.h.toFixed(1)}  (${(CAM.h / JELLY).toFixed(0)} jellies)\npitch          ${(CAM.pitch * 180 / Math.PI).toFixed(1)}°\n`
    + `boardwalk len  ${L.rail[1].distanceTo(L.rail.at(-1)).toFixed(0)}\nresort  ${L.resortW.toFixed(0)} wide, ${L.resortH.toFixed(0)} tall\npier length    ${L.pierLen.toFixed(0)}\njellies        ${L.jellies}\n\n`
    + `jelly height in pt (390-pt phone)\n${'where'.padEnd(11)}${'dist'.padStart(6)}${STOPS.map(x => x.k.padStart(6)).join('')}\n`;
  for (const [n, dist] of rows) s += n.padEnd(11) + dist.toFixed(0).padStart(6) + STOPS.map(x => jellyPx(dist, CAM.fov / x.m).toFixed(1).padStart(6)).join('') + '\n';
  s += `\nwalk the beach  ~${(Math.abs(L.zEnd) / 1.4 / 60).toFixed(1)} min at 1.4/s`;
  $('metrics').textContent = s;
}

resize(); relayout();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (mode === 'perch') {
    if (anim) { const t = Math.min(1, (performance.now() - anim.t0) / 150); cam.fov = anim.from + (anim.to - anim.from) * (1 - (1 - t) ** 3); if (t >= 1) anim = null; }
    cam.aspect = ASPECT; cam.updateProjectionMatrix(); cam.position.copy(rc.position);
    cam.rotation.set(-CAM.pitch - pitchOff, -yaw, 0, 'YXZ');
  }
  renderer.render(scene, cam);
});
</script>
