<style>
/* LVL-01 built out on the frozen layout (level1-layout.js): the person's concept, an 80° lens on the concept frame,
   a 13-wide boardwalk. Mobile only, portrait. On a desktop the page shows a phone-shaped frame (9 : 19.5).
   The horizontal field of view is the concept's; a taller phone sees more sky and more roof, not a different level. */
html, body { margin: 0; height: 100%; background: #19141f; overflow: hidden; font: 13px/1.3 system-ui, -apple-system, sans-serif; touch-action: none; user-select: none; }
#phone { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #000; }

/* the scope: clay3d's housing art and etched reticle. Housing asset is 1078 x 1221 drawn 98cqw wide; its glass centre
   (533.2, 600.1) sits at (50cqw, --cy). The glass itself is rendered in WebGL (sharp lens view inside, shaded eye view outside). */

#scopeUI.on { visibility: visible; }
.housing { position: absolute; left: 1.53cqw; top: calc(var(--cy) - 54.55cqw); width: 98cqw; height: auto; pointer-events: none; filter: drop-shadow(0 1.4cqw 2.2cqw rgba(24, 14, 46, .45)); }
.scopebox { position: absolute; left: 50cqw; top: var(--cy); width: 89.95cqw; height: 89.95cqw; transform: translate(-50%, -50%); }
.scopebox svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font: 700 10px system-ui; padding: 2px 6px; border-radius: 8px; color: #fff; background: #3a2547cc; }
.tag.zone { background: #ffffffd8; color: #3a2547; font-size: 11px; }
.tag.target { background: #ff3b5cdd; }
body.lab-off .tag, body.lab-zones .tag:not(.zone), body.lab-targets .tag:not(.target) { display: none; }
/* HUD: top band over the sky, bottom band over the roof ledge, all in thumb reach */
#top { position: absolute; left: 10px; right: 10px; top: max(10px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card { background: #fffaf2ee; color: #3a2547; border-radius: 14px; padding: 7px 10px; font-size: 11.5px; box-shadow: 0 3px 10px #0004; max-width: 62%; }
.card b { color: #ff3b5c; }
#bottom { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; }
button { border: 0; border-radius: 12px; padding: 8px 11px; font: 700 12px system-ui; color: #fff; background: #3a2547dd; cursor: pointer; }
button.on { background: #ff4f9a; }
#stops button { min-width: 44px; }
#menu { position: absolute; right: 10px; top: 62px; display: none; flex-direction: column; gap: 6px; }
#menu.open { display: flex; }
#jumps { position: absolute; left: 10px; top: 62px; display: none; flex-direction: column; gap: 6px; }
#jumps.open { display: flex; }
#fps { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; font: 700 10px ui-monospace, monospace; color: #fff; text-shadow: 0 1px 2px #000a; }
#review { position: fixed; right: 12px; top: 12px; z-index: 9; background: radial-gradient(130% 120% at 30% 22%, #9af7a0, #3ac45a 46%, #1f9a3a); box-shadow: 0 3px 10px #0005; }
@media (max-aspect-ratio: 1/1.2) { #review { top: auto; bottom: 70px; } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makeJelly, animate, setTransmission, mesh, clay, glossy, sph, G } from './jelly-rig.js';
import * as K from './boardwalk-kit.js';
import { BY_NAME, crowdSpec } from './cast-l1.js';
import * as LY from './level1-layout.js';
const { PAL } = K, { PX, at, SHORE, RAIL, SHOP, FAR_COAST, xAtZ, dirAtZ, CAM, PERCH, BW } = LY;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------- renderer ---------- */
const canvas = document.getElementById('gl'), phone = document.getElementById('phone');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
let seed = 11; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rand = (a, b) => a + rnd() * (b - a), pick = a => a[Math.floor(rnd() * a.length)];
const animated = [];
const place = (obj, p, ry = 0, s = 1) => { obj.position.copy(p); obj.rotation.y = ry; obj.scale.setScalar(s); scene.add(obj);
  obj.traverse(o => { if (o.isMesh) { o.castShadow ??= true; o.receiveShadow = true; } }); if (obj.userData.tick || obj.children.some(c => c.userData.tick)) animated.push(obj); return obj; };
const put = (obj, p, ry, s) => { place(obj, p, ry, s); animated.push(obj); return obj; };
const faceCam = p => Math.atan2(PERCH.x - p.x, PERCH.z - p.z);   // ry that turns a piece's front (+z) toward the perch

/* ---------- sky dome and moods: sun behind the viewer, to the left (south-west) ---------- */
const MOODS = {
  day: { top: '#4fb4f0', mid: '#a6dcf8', hor: '#ffe8e0', sun: '#fffbe8', az: -.6, el: .75, key: '#fff0d8', keyI: 2.7, hemiS: '#d6f0ff', hemiG: '#f3d6a0', hemiI: 1.25, fog: '#d8ecf6', exp: 1.05, sea: '#2bb5c8', rim: '#ffe0c8' },
  sunset: { top: '#4a4aa8', mid: '#ff8aa0', hor: '#ffb066', sun: '#ffd27a', az: -1.3, el: .2, key: '#ff9a5a', keyI: 2.3, hemiS: '#a88ae0', hemiG: '#ff9a6a', hemiI: 1.0, fog: '#ffb48a', exp: 1.0, sea: '#3a8ab8', rim: '#ff6aa8' },
};
const skyU = { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunCol: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform vec3 top, mid, hor, sunCol, sunDir; varying vec3 vD;
    void main(){ float h = max(vD.y, -.05); vec3 c = mix(hor, mid, smoothstep(0., .12, h)); c = mix(c, top, smoothstep(.1, .55, h));
      float s = max(dot(normalize(vD), normalize(sunDir)), 0.); c += sunCol * (pow(s, 900.) * 2.5 + pow(s, 10.) * .3);
      float n = sin(vD.x * 7. + sin(vD.z * 4.) * 2.) * sin(vD.z * 6. + vD.x * 3.); float cl = smoothstep(.5, .9, n) * smoothstep(.03, .1, h) * (1. - smoothstep(.14, .32, h));
      c = mix(c, vec3(1., .93, .97), cl * .75);
      gl_FragColor = vec4(c, 1.);
      #include <colorspace_fragment>
    }` }));
sky.renderOrder = -1; scene.add(sky);
const hemi = new THREE.HemisphereLight('#d6f0ff', '#f3d6a0', 1.25); scene.add(hemi);
const key = new THREE.DirectionalLight('#fff0d8', 2.7); key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
key.shadow.bias = -.0005; key.shadow.normalBias = .25; scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#ffe0c8', .5); rim.position.set(80, 40, -300); scene.add(rim);
scene.fog = new THREE.Fog('#d8ecf6', 260, 1500);

/* ======================= ground ======================= */
const shape = pts => new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, -p.z)));
const flat = (pts, mat, y) => { const m = new THREE.Mesh(new THREE.ShapeGeometry(shape(pts), 2).rotateX(-Math.PI / 2), mat); m.position.y = y; m.receiveShadow = true; scene.add(m); return m; };
const seaMat = new THREE.MeshPhysicalMaterial({ color: PAL.sea, roughness: .14, clearcoat: 1, clearcoatRoughness: .08, sheen: .4, sheenColor: new THREE.Color('#cffaff') });
{ const s = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000).rotateX(-Math.PI / 2), seaMat); s.position.set(-1500, -.3, -2000); s.receiveShadow = true; scene.add(s); }
// shallows: a lighter band hugging the shore
{ const out = SHORE.map((p, i) => { const d = dirAtZ(SHORE, p.z); return p.clone().add(V(d.z, 0, -d.x).multiplyScalar(-(10 + i * .6))); });
  flat([...SHORE, ...out.reverse()], new THREE.MeshPhysicalMaterial({ color: '#63dbd6', roughness: .1, clearcoat: 1, transparent: true, opacity: .6 }), -.2); }
// land: sand from the shoreline inland, the far coast across the bay
const far = FAR_COAST, land = [...SHORE, ...far, V(4000, 0, far.at(-1).z), V(4000, 0, 60), V(SHORE[0].x, 0, 60)];
flat(land, clay(PAL.sand, 1.4), 0);
// wet sand and a breathing foam line
{ const inl = SHORE.map(p => { const d = dirAtZ(SHORE, p.z); return p.clone().add(V(-d.z, 0, d.x).multiplyScalar(3.2)); });
  flat([...SHORE.slice(0, -3), ...inl.slice(0, -3).reverse()], clay(PAL.wetSand, 1.3), .03);
  const foam = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(SHORE.slice(0, -2).map(p => V(p.x, .08, p.z))), 500, .45, 6), clay(PAL.foam, .4));
  foam.scale.y = .35; scene.add(foam); animated.push({ userData: { tick: [t => { foam.position.x = Math.sin(t * .7) * .6; }] }, traverse(f) { f(this); } }); }
// ripples on the sea, denser near the shore
{ const ripple = G('ripple', () => new THREE.TorusGeometry(1, .04, 3, 14, Math.PI * .5).rotateX(Math.PI / 2)), n = 260;
  const im = new THREE.InstancedMesh(ripple, new THREE.MeshLambertMaterial({ color: '#7fdce8', transparent: true, opacity: .55 }), n), m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let i = 0; i < n; i++) { const z = rand(20, -700) * (rnd() < .6 ? .5 : 1), x = xAtZ(SHORE, Math.max(z, SHORE.at(-1).z)) - rand(6, 260); const s = 1.5 + (-z) * .03;
    q.setFromAxisAngle(V(0, 1, 0), Math.PI * 1.2 + rand(-.2, .2)); m4.compose(V(x, -.18, z), q, V(s * 1.8, 1, s)); im.setMatrixAt(i, m4); }
  im.castShadow = false; scene.add(im); }
// the distant coast across the bay: low green hills and pastel roofs
for (let i = 0; i < 70; i++) { const t = rnd(), a = far[Math.floor(t * (far.length - 1))], b = far[Math.ceil(t * (far.length - 1))], p = a.clone().lerp(b, rnd());
  const h = mesh(sph(1, 10, 6), clay(pick([PAL.palm, PAL.palmDk, '#79c46a'])), scene, p.x + rand(-40, 40), 0, p.z - rand(10, 120)); h.scale.set(rand(30, 70), rand(8, 22), rand(20, 40)); }

/* ======================= boardwalk ======================= */
const DECK_Y = -.2, BWY = .45;
for (let i = 0; i < RAIL.length - 1; i++) {
  const a = RAIL[i], b = RAIL[i + 1], sa = SHOP[i], sb = SHOP[i + 1], len = a.distanceTo(b) + .9, d = b.clone().sub(a).normalize();
  const mid = a.clone().lerp(b, .5).lerp(sa.clone().lerp(sb, .5), .5); mid.y = DECK_Y;
  place(K.boardwalkDeck(Math.min(len, 400), BW), mid, Math.atan2(-d.z, d.x));
}
// lamps on the rail, every 16
for (let i = 0; i < RAIL.length - 1; i++) { const a = RAIL[i], b = RAIL[i + 1], len = a.distanceTo(b);
  for (let t = 4; t < len; t += 16) { const p = a.clone().lerp(b, t / len); p.x += .9; p.y = BWY; place(K.streetLamp(), p, 0, 1.35); } }
// stalls on the town side, angled toward the boardwalk and the perch
const stallAt = (pxY, obj, s = 1.25, inset = 3) => { const z = at([800, pxY]).z, p = V(xAtZ(SHOP, z) - inset, BWY, z); return put(obj, p, -Math.PI / 2 + .55, s); };
const rosa = stallAt(1235, K.stall({ sign: "ROSA'S MARGARITAS", cols: [PAL.lemon, '#8ad84a'], body: PAL.teal, extra: g => { mesh(G('blender', () => new THREE.CylinderGeometry(.25, .18, .6, 12)), glossy('#bfeaff', { transparent: true, opacity: .6 }), g, .9, 1.5, .2); } }));
const vinnie = stallAt(1120, K.shack('AIRBRUSH TEES'));
const arcade = stallAt(1000, K.arcade(), 1.35, 4);
const golf = stallAt(900, K.miniGolf(), 1.3, 6);
const pam = stallAt(790, K.stall({ sign: "PAM'S SHARK TEETH", cols: [PAL.flamingo, PAL.white], body: '#3a7aff' }));
const halCart = put(K.hotDogCart(), V(xAtZ(RAIL, at([0, 1330]).z) + BW * .55, BWY, at([0, 1330]).z), -.4, 1.2);
const plinthP = V(xAtZ(RAIL, at([0, 1180]).z) + BW * .4, BWY, at([0, 1180]).z); put(K.plinth(), plinthP, 0, 1.2);
// the welcome banner over the boardwalk exit, near the perch: everyone leaves under it at the end
{ const z = at([0, 1420]).z, p = V((xAtZ(RAIL, z) + xAtZ(SHOP, z)) / 2, BWY, z); put(K.welcomeArch(), p, Math.atan2(-dirAtZ(RAIL, z).z, dirAtZ(RAIL, z).x) + Math.PI / 2, BW / 9); }
// palms along the boardwalk and in town
PX.palmsBeach.forEach((q, i) => put(K.palm(rand(10, 13), rand(.1, .3), rnd()), at(q), rand(0, 6)));
PX.palmsShop.forEach(q => put(K.palm(rand(11, 14), rand(.1, .3), rnd()), at(q), rand(0, 6)));

/* ---------- town: pastel blocks behind the stall line, out to the resort ---------- */
const TOWN = ['#ffd8b0', '#ffc2d6', '#c8e8ff', '#d8f0c0', '#fff0a8', '#e8d0ff', '#ffe0e8', '#bff0e0'];
for (let i = 1; i < SHOP.length - 1; i++) { const a = SHOP[i], b = SHOP[i + 1], len = a.distanceTo(b), d = b.clone().sub(a).normalize(), rt = V(-d.z, 0, d.x);
  for (let t = 0; t < len; t += rand(12, 16)) for (let row = 0; row < 5; row++) {
    const p = a.clone().addScaledVector(d, t + 6).addScaledVector(rt, 12 + row * 17 + rand(-1, 1)); if (row === 0 && p.z > at([0, 760]).z) continue;   // keep the stall line clear
    const w = rand(9, 13), h = rand(4, row ? 14 : 7), g = new THREE.Group(), col = pick(TOWN);
    K.box(g, w, h, w * rand(.7, 1), clay(col, 1.1), 0, 0, 0, .4); K.box(g, w + .6, .5, w * .9, clay(PAL.white), 0, h, 0, .2);
    for (let k = 0; k < Math.floor(h / 3); k++) K.box(g, w * .7, .9, .1, glossy('#7fd8f0'), 0, 1.4 + k * 3, w * .45, .06);
    place(g, p, Math.atan2(d.x, d.z) + Math.PI, 1); } }

/* ======================= beach ======================= */
const towerA = put(K.lifeguardTower(PAL.red, false), at(PX.towerRed), Math.PI * .85, 1.4);
const towerB = put(K.lifeguardTower('#ffb020', true), at(PX.towerYellow), Math.PI * .8, 1.4);
const [n1, n2] = PX.net.map(at), court = n1.clone().lerp(n2, .5);
put(K.volleyballCourt(), court, Math.atan2(-(n2.z - n1.z), n2.x - n1.x), 1.2);
const castle = at(PX.sandcastle); put(K.sandcastle(), castle, -.3, 1.6);
const frank = at(PX.iceCreamCart); put(K.iceCreamCart(), frank, -.4, 1.2);
const UMB = [[PAL.coral, PAL.white], ['#3a7aff', PAL.white], [PAL.sun, PAL.pink], [PAL.flamingo, PAL.white], [PAL.teal, PAL.white], [PAL.orange, PAL.lemon]];
const beachSpots = [];
const umb = p => { put(K.umbrella(pick(UMB)), p, rand(0, 6), 1.3); place(K.towel(pick([PAL.pink, PAL.teal, PAL.sun, '#a68cff', PAL.coral])), V(p.x + 1.4, 0, p.z + 1), rand(-.4, .4), 1.3); beachSpots.push(V(p.x + 1.4, 0, p.z + 1)); };
PX.umbrellas.forEach(q => umb(at(q)));
const zNear = RAIL[1].z, zPier = at([0, 598]).z, zEnd = at([668, 505]).z;
const onBeach = (z, lo = .12, hi = .9) => V(xAtZ(SHORE, z) + (xAtZ(RAIL, z) - xAtZ(SHORE, z)) * rand(lo, hi), 0, z);
for (let i = 0; i < 26; i++) { const p = onBeach(zNear + (zPier - zNear) * Math.pow(rnd(), 1.4)); if (p.distanceTo(court) > 9 && p.distanceTo(castle) > 5) umb(p); }
for (let i = 0; i < 10; i++) umb(onBeach(rand(zPier, zEnd)));

/* ======================= pier ======================= */
const [pA, pB] = PX.pier.map(at), pierU = pB.clone().sub(pA).normalize(), pierLen = pA.distanceTo(pB), pierRy = Math.atan2(-pierU.x, -pierU.z);
const pierSide = V(-pierU.z, 0, pierU.x);   // left of the walk out = toward the perch
const onPier = (s, side = 0, y = 2.1) => pA.clone().addScaledVector(pierU, s).addScaledVector(pierSide, side).setY(y);
place(K.pierDeck(pierLen, 7), pA.clone().setY(-.2), pierRy);
put(K.baitShop(), onPier(9, -1.5), pierRy + Math.PI, 1.3);
const booth = onPier(pierLen * .5); put(K.jiggleBooth(), booth, pierRy - Math.PI / 2 + .9, 1.3);
put(K.shelly(), booth.clone(), 0, 1.2);
put(K.bench(), onPier(pierLen * .72, 2.6), pierRy + Math.PI / 2); put(K.bench(), onPier(pierLen * .82, -2.6), pierRy - Math.PI / 2);

/* ======================= water ======================= */
const [dA, dB] = PX.jetDock.map(at); { const u = dB.clone().sub(dA).normalize(); put(K.dock(dA.distanceTo(dB)), dA.clone().setY(-.15), Math.atan2(-u.x, -u.z));
  [PAL.lemon, PAL.pink, '#3a7aff'].forEach((c, i) => put(K.jetSki(c), dA.clone().lerp(dB, .4 + i * .18).add(V(2.5, -.1, 2.2)), Math.PI, 1.2)); }

/* ======================= camera: perch, zoom stops, scope ======================= */
// The naked eye keeps the concept's horizontal field of view; the phone's height decides how much sky and roof shows.
// The scope is clay3d's: a second camera renders sharp into a square target shown in the glass, while the eye view
// around it is blurred and shaded. Zoom is in stops; ×m magnifies m times against the naked eye.
const H_FOV = 2 * Math.atan(Math.tan(LY.LENS * Math.PI / 360) * LY.IW / LY.IH);
const STOPS = [['Eye', 1], ['1', 3.5], ['2', 7], ['3', 14]];
const camera = new THREE.PerspectiveCamera(LY.LENS, 9 / 19.5, .3, 6000);
const scopeCam = new THREE.PerspectiveCamera(10, 1, .3, 6000);
let aspect = 9 / 19.5, stop = 0, yaw = 0, pitch = -CAM.pitch, mode = 'perch', zoomAnim = null, mag = 1;
let W = 0, H = 0, DPR = 1, scopePx = { x: 0, y: 0, r: 1 };
const vfov = h => 2 * Math.atan(Math.tan(h / 2) / aspect) * 180 / Math.PI;
const glassFov = m => 2 * Math.atan(Math.tan(H_FOV / 2) * (2 * scopePx.r / W) / m) * 180 / Math.PI;   // the glass spans 2r of the eye's W
const stopsEl = document.getElementById('stops');
STOPS.forEach(([k], i) => { const b = document.createElement('button'); b.textContent = i ? '×' + STOPS[i][1] : 'Eye'; b.onclick = () => setStop(i); stopsEl.appendChild(b); });
function setStop(i, aimAt) {
  i = Math.max(0, Math.min(STOPS.length - 1, i)); if (mode === 'fly') setMode('perch');
  const was = stop; stop = i; if (i === 0) { yaw = 0; pitch = -CAM.pitch; }
  if (aimAt) { const d = aimAt.clone().sub(PERCH).normalize(); yaw = Math.atan2(-d.x, -d.z); pitch = Math.asin(d.y); }
  const to = STOPS[i][1]; zoomAnim = { from: was ? mag : to * .6, to, t0: performance.now() };
  [...stopsEl.children].forEach((b, j) => b.classList.toggle('on', j === i));
  document.getElementById('scopeUI').classList.toggle('on', i > 0);
}
function applyPerch(t) {
  camera.position.copy(PERCH); camera.aspect = aspect; camera.fov = vfov(H_FOV); camera.updateProjectionMatrix();
  // scoped, the eye drifts a little after the rifle so the blurred surround moves with you
  if (stop) camera.rotation.set(-CAM.pitch + (pitch + CAM.pitch) * .3, yaw * .3, 0, 'YXZ'); else camera.rotation.set(pitch, yaw, 0, 'YXZ');
  // the rifle breathes (clay3d's sway)

}

/* ---------- render targets + composite (from clay3d) ---------- */
const rtScope = new THREE.WebGLRenderTarget(16, 16, { samples: 4, type: THREE.HalfFloatType });
const rtEye = new THREE.WebGLRenderTarget(16, 16, { type: THREE.HalfFloatType });
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const compMat = new THREE.ShaderMaterial({
  uniforms: { tScope: { value: rtScope.texture }, tEye: { value: rtEye.texture }, res: { value: new THREE.Vector2() }, eyeRes: { value: new THREE.Vector2() }, center: { value: new THREE.Vector2() }, R: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `
    uniform sampler2D tScope, tEye; uniform vec2 res, eyeRes, center; uniform float R; varying vec2 vUv;
    vec3 blurEye(vec2 uv){
      vec2 px = 1. / eyeRes; vec3 s = vec3(0.); float w = 0.;
      for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++) {
        float k = exp(-float(i*i + j*j) / 6.); s += texture2D(tEye, uv + vec2(i, j) * px * 1.4).rgb * k; w += k; }
      return s / w;
    }
    void main(){
      vec2 p = vUv * res; float d = length(p - center);
      vec3 col;
      if (d < R) {
        vec2 uv = (p - center) / (2. * R) + .5;
        col = texture2D(tScope, uv).rgb;
        float e = smoothstep(R * .7, R, d);
        col *= 1. - .28 * e;
        vec2 q = (p - center) / R;
        col += vec3(1., .86, .74) * .10 * smoothstep(.2, -.9, q.x - q.y) * e;
      } else {
        col = blurEye(vUv);
        col = mix(col, vec3(.05, .07, .12), .2) * .86;
        col = mix(vec3(dot(col, vec3(.299, .587, .114))), col, 1.12);
        float v = smoothstep(R, R * 2.2, d); col *= 1. - .28 * v;
        float ds = length(p - (center + vec2(.0, -.045 * R)));
        col *= 1. - .5 * smoothstep(R * 1.34, R * 1.08, ds);
      }
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  toneMapped: true, depthTest: false, depthWrite: false
});
const quadScene = new THREE.Scene(); quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compMat));
